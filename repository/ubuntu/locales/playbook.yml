---
# CANDIDATE FOR REVIEW - not yet approved.
#
# Rollback: this playbook only advances locales to the distribution's latest
# available version. To roll back, pin the previous version explicitly.
- name: Remediate locales
  hosts: linux_servers
  become: true
  gather_facts: true
  tasks:
    - name: Gather installed packages
      ansible.builtin.package_facts:
        manager: auto

    - name: Update locales to the latest available version
      ansible.builtin.apt:
        name: locales
        state: latest

    - name: Report the resulting version
      ansible.builtin.debug:
        msg: "locales processed on {{ inventory_hostname }}"
