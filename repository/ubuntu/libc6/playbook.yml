---
# CANDIDATE FOR REVIEW - not yet approved.
#
# Rollback: this playbook only advances libc6 to the distribution's latest
# available version. To roll back, pin the previous version explicitly.
- name: Remediate libc6
  hosts: linux_servers
  become: true
  gather_facts: true
  tasks:
    - name: Gather installed packages
      ansible.builtin.package_facts:
        manager: auto

    - name: Update libc6 to the latest available version
      ansible.builtin.apt:
        name: libc6
        state: latest

    - name: Report the resulting version
      ansible.builtin.debug:
        msg: "libc6 processed on {{ inventory_hostname }}"
